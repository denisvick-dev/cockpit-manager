# ------------------------------------------------------------------
# Cockpit Manager — tema corporativo
# Tipografia padrão da F1: família oficial Formula1 Display (títulos/marcas)
# + Titillium Web (texto, OFL) — como no site da F1 — auto-hospedadas em
# static/fonts/ e servidas pelo próprio Streamlit (server.enableStaticServing).
# Blocos de código: IBM Plex Mono (OFL).
# ------------------------------------------------------------------
[theme]
base = "dark"
primaryColor = "#C8102E"                 # crimson corporativo
backgroundColor = "#0B0F14"              # grafite
secondaryBackgroundColor = "#151C25"     # painéis
textColor = "#E9EDF2"
borderColor = "#28313D"
linkColor = "#E4636F"
font = "Titillium Web"
headingFont = "Formula1"
codeFont = "IBM Plex Mono"
baseFontSize = 16
headingFontWeights = [700, 700, 400, 400, 400, 400]
chartCategoricalColors = ["#C8102E", "#2E6DA4", "#2E8B70", "#C9A227", "#8494A6", "#7A5FB0"]
dataframeHeaderBackgroundColor = "#1A212B"
dataframeHeaderTextColor = "#DCE3EA"
codeBackgroundColor = "#11161E"

[[theme.fontFaces]]
family = "Formula1"
url = "app/static/fonts/Formula1-Regular.woff2"
weight = "400"

[[theme.fontFaces]]
family = "Formula1"
url = "app/static/fonts/Formula1-Bold.woff2"
weight = "700"

[[theme.fontFaces]]
family = "Formula1"
url = "app/static/fonts/Formula1-Black.woff2"
weight = "900"

[[theme.fontFaces]]
family = "Formula1"
url = "app/static/fonts/Formula1-Italic.woff2"
weight = "400"
style = "italic"

[[theme.fontFaces]]
family = "Titillium Web"
url = "app/static/fonts/titillium-web-latin-400-normal.woff2"
weight = "400"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

