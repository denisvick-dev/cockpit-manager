name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes + cobertura (piso de 75%)
        run: python -m pytest -q --cov --cov-report=term-missing

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Subir o Streamlit e checar a saúde do servidor
        run: |
          streamlit run app.py --server.port 8501 --server.headless true --server.address 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              echo "Streamlit respondeu OK"; exit 0
            fi
            sleep 2
          done
          echo "O servidor não respondeu em 80s" >&2
          exit 1
